<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billiards & Darts Midnight - QR Code Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- qrcode-generator JS CDN for standard QR matrix calculation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <style>
    /* midhead.gifの配色に完全マッチさせたミッドナイトテーマ */
    body {
      background: radial-gradient(circle at top, #0f182e 0%, #050814 75%, #000000 100%);
      font-family: 'Montserrat', sans-serif, "Hiragino Kaku Gothic ProN", "Meiryo";
      color: #ffffff;
      min-height: 100vh;
    }

    /* ネオン枠線とガラスモーフィズム */
    .midnight-card {
      background: rgba(10, 17, 40, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(45, 69, 160, 0.4);
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.8), 0 0 20px rgba(26, 43, 109, 0.3);
    }

    .glow-button {
      background: linear-gradient(135deg, #132252 0%, #2d45a0 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(45, 69, 160, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .glow-button:hover {
      background: linear-gradient(135deg, #1a2b6d 0%, #3b5bdb 100%);
      box-shadow: 0 0 25px rgba(59, 91, 219, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #050814;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a2b6d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2d45a0;
    }

    /* スライダーのカスタム */
    input[type=range] {
      accent-color: #2d45a0;
    }
  </style>
</head>
<body class="p-3 md:p-6 flex flex-col justify-between items-center">

  <!-- ヘッダーエリア（添付画像 midhead.gif をそのままヘッダーに配置） -->
  <header class="w-full max-w-4xl text-center py-6 my-2 flex flex-col items-center">
    <div class="inline-block p-3 rounded-2xl bg-black/40 border border-blue-900/30 shadow-2xl hover:scale-105 transition-transform duration-300">
      <img id="header-logo-img" src="midhead.gif" alt="Billiards & Darts Midnight" class="h-20 md:h-24 object-contain mx-auto filter drop-shadow-[0_0_12px_rgba(255,255,255,0.4)]" onerror="this.onerror=null; this.src='https://placehold.co/280x100/000000/ffffff?text=midhead.gif+Missing';">
    </div>
    <p class="text-yellow-300/80 text-xs md:text-sm mt-4 tracking-widest uppercase font-semibold">
      <i class="fa-solid fa-qrcode mr-2 text-yellow-400"></i>Logo Overlay QR Code Generator
    </p>
  </header>

  <!-- メインコンテンツ -->
  <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6 my-2">
    
    <!-- 左側：設定パネル (7カラム) -->
    <section class="lg:col-span-7 midnight-card rounded-2xl p-5 md:p-7 space-y-6">
      
      <!-- 1. 入力コンテンツ -->
      <div>
        <label class="block text-sm font-semibold text-yellow-200 mb-2">
          <i class="fa-solid fa-link mr-2 text-yellow-400"></i>QRコードに載せるテキスト / URL
        </label>
        <textarea id="qr-data" rows="3" 
          class="w-full bg-slate-950/90 border border-blue-900/60 rounded-xl p-3 text-sm text-yellow-100 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-all placeholder-yellow-700/60"
          placeholder="https://example.com や任意のテキストを入力してください">https://example.com</textarea>
      </div>

      <!-- 2. ロゴ画像設定 -->
      <div class="border-t border-slate-800/80 pt-5">
        <label class="block text-sm font-semibold text-yellow-200 mb-2">
          <i class="fa-solid fa-image mr-2 text-yellow-400"></i>中央ロゴ画像の切り替え
        </label>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
          <!-- ファイル選択 -->
          <div>
            <label for="logo-file" class="flex items-center justify-center w-full p-3 bg-slate-950/80 border border-dashed border-blue-500/40 rounded-xl cursor-pointer hover:bg-slate-900/80 hover:border-blue-400 transition-all text-xs text-yellow-300">
              <i class="fa-solid fa-cloud-arrow-up text-base mr-2 text-yellow-400"></i>
              <span id="file-name-display">カスタム画像をアップロード</span>
            </label>
            <input type="file" id="logo-file" accept="image/*" class="hidden">
          </div>

          <!-- デフォルトロゴに戻すボタン -->
          <button id="reset-logo-btn" type="button" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 text-yellow-200 border border-slate-700/60 rounded-xl text-xs flex items-center justify-center transition-all">
            <i class="fa-solid fa-rotate-left mr-2 text-yellow-400"></i>原稿ロゴ (midhead.gif) に復元
          </button>
        </div>

        <!-- ロゴサイズ調整 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/60">
          <div>
            <div class="flex justify-between text-xs text-yellow-200 mb-1">
              <span>ロゴの大きさ (相対比)</span>
              <span id="logo-size-val" class="text-yellow-400 font-mono">32%</span>
            </div>
            <input type="range" id="logo-size" min="15" max="32" value="32" class="w-full cursor-pointer">
          </div>
          <div>
            <div class="flex justify-between text-xs text-yellow-200 mb-1">
              <span>ロゴ背景（白枠 Padding）</span>
              <span id="logo-padding-val" class="text-yellow-400 font-mono">8px</span>
            </div>
            <input type="range" id="logo-padding" min="0" max="16" value="8" class="w-full cursor-pointer">
          </div>
        </div>
      </div>

      <!-- 3. デザイン & カスタマイズ -->
      <div class="border-t border-slate-800/80 pt-5 space-y-4">
        <label class="block text-sm font-semibold text-yellow-200">
          <i class="fa-solid fa-sliders mr-2 text-yellow-400"></i>サイズ＆配色カスタマイズ
        </label>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <!-- サイズ選択 -->
          <div>
            <label class="block text-xs text-yellow-200 mb-1">解像度 (px)</label>
            <select id="qr-size" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-yellow-100 focus:outline-none focus:border-blue-400">
              <option value="200">200 x 200 px</option>
              <option value="300">300 x 300 px (Web標準)</option>
              <option value="500" selected>500 x 500 px (高画質)</option>
              <option value="800">800 x 800 px (印刷用 HQ)</option>
              <option value="1200">1200 x 1200 px (印刷用 HD)</option>
            </select>
          </div>

          <!-- コード色 (Foreground) -->
          <div>
            <label class="block text-xs text-yellow-200 mb-1">コードの色 (前景色)</label>
            <div class="flex items-center space-x-2">
              <input type="color" id="color-dark" value="#050814" class="h-8 w-10 bg-transparent rounded cursor-pointer border-0">
              <span id="color-dark-hex" class="text-xs font-mono text-yellow-200">#050814</span>
            </div>
          </div>

          <!-- 背景色 (Background) -->
          <div>
            <label class="block text-xs text-yellow-200 mb-1">背景色</label>
            <div class="flex items-center space-x-2">
              <input type="color" id="color-light" value="#ffffff" class="h-8 w-10 bg-transparent rounded cursor-pointer border-0">
              <span id="color-light-hex" class="text-xs font-mono text-yellow-200">#ffffff</span>
            </div>
          </div>
        </div>

        <!-- 誤り訂正レベル -->
        <div class="bg-blue-950/30 border border-blue-900/50 p-3 rounded-xl text-xs text-yellow-200/90 flex items-start space-x-2">
          <i class="fa-solid fa-shield-halved text-yellow-400 text-sm mt-0.5"></i>
          <div>
            <span class="font-semibold text-yellow-300">誤り訂正レベル H (High Error Correction):</span>
            コードの約30%が復元可能に設定されています。中央にロゴ画像を重ねてもスキャナーでの高い読み取り率を確保できます。
          </div>
        </div>
      </div>

    </section>

    <!-- 右側：プレビュー & アクション (5カラム) -->
    <section class="lg:col-span-5 flex flex-col justify-between midnight-card rounded-2xl p-5 md:p-7 text-center">
      <div>
        <h2 class="text-sm font-semibold text-yellow-200 mb-4 flex items-center justify-center">
          <i class="fa-solid fa-eye mr-2 text-yellow-400"></i>リアルタイム プレビュー
        </h2>

        <!-- Canvas表示エリア -->
        <div class="relative inline-block p-4 bg-slate-950 rounded-2xl border border-blue-900/50 shadow-inner max-w-full">
          <canvas id="qr-canvas" class="max-w-full h-auto rounded-lg mx-auto shadow-2xl transition-all duration-300" style="max-height: 320px;"></canvas>
        </div>

        <!-- 情報表示 -->
        <div id="status-message" class="text-xs text-yellow-200 mt-3">
          画面上で右クリックでの保存、または下のボタンからダウンロードできます。
        </div>
      </div>

      <!-- アクションボタン群 -->
      <div class="space-y-3 mt-6">
        <button id="download-btn" type="button" class="w-full glow-button text-yellow-100 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center text-sm tracking-wide">
          <i class="fa-solid fa-download mr-2 text-lg"></i>PNG画像として保存
        </button>

        <button id="copy-btn" type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-yellow-200 border border-blue-800/50 font-medium py-2.5 px-4 rounded-xl flex items-center justify-center text-xs transition-all">
          <i class="fa-solid fa-copy mr-2"></i>クリップボードにコピー
        </button>
      </div>
    </section>

  </main>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 right-6 bg-blue-600 text-yellow-100 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check"></i>
    <span id="toast-msg" class="text-xs font-semibold">メッセージ</span>
  </div>

  <!-- フッター -->
  <footer class="w-full text-center text-yellow-300/70 text-xs py-4 my-2">
    &copy; Billiards & Darts Midnight. All Rights Reserved.
  </footer>

  <!-- アプリケーションJavaScript -->
  <script>
    // --- グローバル変数・DOM要素 ---
    const qrDataInput = document.getElementById('qr-data');
    const logoFileInput = document.getElementById('logo-file');
    const fileNameDisplay = document.getElementById('file-name-display');
    const resetLogoBtn = document.getElementById('reset-logo-btn');
    const logoSizeInput = document.getElementById('logo-size');
    const logoSizeVal = document.getElementById('logo-size-val');
    const logoPaddingInput = document.getElementById('logo-padding');
    const logoPaddingVal = document.getElementById('logo-padding-val');
    const qrSizeSelect = document.getElementById('qr-size');
    const colorDarkInput = document.getElementById('color-dark');
    const colorDarkHex = document.getElementById('color-dark-hex');
    const colorLightInput = document.getElementById('color-light');
    const colorLightHex = document.getElementById('color-light-hex');
    
    const qrCanvas = document.getElementById('qr-canvas');
    const ctx = qrCanvas.getContext('2d');
    const downloadBtn = document.getElementById('download-btn');
    const copyBtn = document.getElementById('copy-btn');
    const toast = document.getElementById('toast');

    // 現在使用中のロゴ画像オブジェクト
    let currentLogoImage = new Image();

    // デフォルト画像パス (添付されたオリジナルファイル)
    const DEFAULT_LOGO_PATH = 'midhead.gif';

    // --- 初期化処理 ---
    function init() {
      // 添付画像 midhead.gif の読み込み設定
      currentLogoImage.onload = () => {
        renderQRCode();
      };
      // 読み込みエラー時のフォールバック処理
      currentLogoImage.onerror = () => {
        console.warn('midhead.gif image could not be loaded directly, applying fallback graphics.');
      };
      currentLogoImage.src = DEFAULT_LOGO_PATH;

      // イベントリスナーの登録
      qrDataInput.addEventListener('input', renderQRCode);
      
      logoFileInput.addEventListener('change', handleLogoUpload);
      resetLogoBtn.addEventListener('click', resetToDefaultLogo);

      logoSizeInput.addEventListener('input', (e) => {
        logoSizeVal.textContent = e.target.value + '%';
        renderQRCode();
      });

      logoPaddingInput.addEventListener('input', (e) => {
        logoPaddingVal.textContent = e.target.value + 'px';
        renderQRCode();
      });

      qrSizeSelect.addEventListener('change', renderQRCode);

      colorDarkInput.addEventListener('input', (e) => {
        colorDarkHex.textContent = e.target.value;
        renderQRCode();
      });

      colorLightInput.addEventListener('input', (e) => {
        colorLightHex.textContent = e.target.value;
        renderQRCode();
      });

      downloadBtn.addEventListener('click', downloadQRCode);
      copyBtn.addEventListener('click', copyCanvasToClipboard);
    }

    // --- カスタムロゴアップロード処理 ---
    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      fileNameDisplay.textContent = file.name;
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          currentLogoImage = img;
          renderQRCode();
          showToast('カスタムロゴを設定しました', 'success');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- デフォルトロゴ（midhead.gif）への復元 ---
    function resetToDefaultLogo() {
      logoFileInput.value = '';
      fileNameDisplay.textContent = 'カスタム画像をアップロード';
      currentLogoImage = new Image();
      currentLogoImage.onload = () => {
        renderQRCode();
        showToast('midhead.gif に復元しました', 'info');
      };
      currentLogoImage.src = DEFAULT_LOGO_PATH;
    }

    // --- メイン：QRコード＆ロゴ描画 ---
    function renderQRCode() {
      const text = qrDataInput.value.trim();
      const canvasSize = parseInt(qrSizeSelect.value, 10);
      const colorDark = colorDarkInput.value;
      const colorLight = colorLightInput.value;

      // キャンバスサイズの初期設定
      qrCanvas.width = canvasSize;
      qrCanvas.height = canvasSize;

      // 入力が空の場合はクリア
      if (!text) {
        ctx.fillStyle = colorLight;
        ctx.fillRect(0, 0, canvasSize, canvasSize);
        return;
      }

      try {
        // qrcode-generator ライブラリを使用してマトリックスを計算
        // typeNumber=0 (自動判別), errorCorrectionLevel='H' (最高レベル: 30%復元)
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const moduleCount = qr.getModuleCount();
        const cellSize = canvasSize / moduleCount;

        // 1. 背景描画
        ctx.fillStyle = colorLight;
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        // 2. QRコードモジュール描画
        ctx.fillStyle = colorDark;
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            if (qr.isDark(row, col)) {
              // 精密な描画のために四捨五入補正
              const x = Math.floor(col * cellSize);
              const y = Math.floor(row * cellSize);
              const w = Math.ceil((col + 1) * cellSize) - x;
              const h = Math.ceil((row + 1) * cellSize) - y;
              ctx.fillRect(x, y, w, h);
            }
          }
        }

        // 3. 中央ロゴの描画
        if (currentLogoImage && currentLogoImage.complete && currentLogoImage.naturalWidth !== 0) {
          const logoScale = parseInt(logoSizeInput.value, 10) / 100;
          const logoPadding = parseInt(logoPaddingInput.value, 10);

          // ロゴのアスペクト比を維持してサイズ計算
          let logoWidth = canvasSize * logoScale;
          let logoHeight = logoWidth * (currentLogoImage.naturalHeight / currentLogoImage.naturalWidth);

          // QRコードの中央座標
          const centerX = canvasSize / 2;
          const centerY = canvasSize / 2;
          const logoX = centerX - logoWidth / 2;
          const logoY = centerY - logoHeight / 2;

          // 3-a. ロゴ背景の白枠（マスク）を描画してQRスキャンの可読性を完全確保
          const bgX = logoX - logoPadding;
          const bgY = logoY - logoPadding;
          const bgWidth = logoWidth + (logoPadding * 2);
          const bgHeight = logoHeight + (logoPadding * 2);
          const borderRadius = 8;

          ctx.save();
          ctx.fillStyle = colorLight;
          
          // 角丸矩形の描画
          ctx.beginPath();
          ctx.moveTo(bgX + borderRadius, bgY);
          ctx.lineTo(bgX + bgWidth - borderRadius, bgY);
          ctx.quadraticCurveTo(bgX + bgWidth, bgY, bgX + bgWidth, bgY + borderRadius);
          ctx.lineTo(bgX + bgWidth, bgY + bgHeight - borderRadius);
          ctx.quadraticCurveTo(bgX + bgWidth, bgY + bgHeight, bgX + bgWidth - borderRadius, bgY + bgHeight);
          ctx.lineTo(bgX + borderRadius, bgY + bgHeight);
          ctx.quadraticCurveTo(bgX, bgY + bgHeight, bgX, bgY + bgHeight - borderRadius);
          ctx.lineTo(bgX, bgY + borderRadius);
          ctx.quadraticCurveTo(bgX, bgY, bgX + borderRadius, bgY);
          ctx.closePath();
          ctx.fill();

          // 影の演出
          ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 2;

          // 3-b. midhead.gif ロゴ画像本体を描画
          ctx.drawImage(currentLogoImage, logoX, logoY, logoWidth, logoHeight);
          ctx.restore();
        }

      } catch (err) {
        console.error('QR Code Generation Error:', err);
      }
    }

    // --- QRコードの保存（ダウンロード） ---
    function downloadQRCode() {
      let dataURL;
      try {
        dataURL = qrCanvas.toDataURL('image/png');
      } catch (e) {
        // file:// で開いた場合、ローカル画像でキャンバスが汚染され保存できないことがある
        showToast('保存できません。ローカルサーバー経由で開くか、ロゴをアップロードしてください', 'error');
        return;
      }
      const link = document.createElement('a');
      link.download = `QR_Midnight_${Date.now()}.png`;
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('QRコード画像をダウンロードしました', 'success');
    }

    // --- クリップボードにコピー ---
    function copyCanvasToClipboard() {
      qrCanvas.toBlob((blob) => {
        if (!blob) {
          showToast('コピーに失敗しました', 'error');
          return;
        }
        try {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            showToast('画像をクリップボードにコピーしました', 'success');
          }).catch(err => {
            console.error(err);
            showToast('お使いのブラウザでは直接コピーに対応していません', 'error');
          });
        } catch (e) {
          showToast('コピー機能は未対応です', 'error');
        }
      });
    }

    // --- トースト通知機能 ---
    function showToast(message, type = 'info') {
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = message;
      
      if (type === 'success') {
        toast.className = toast.className.replace(/bg-\w+-\d+/, 'bg-emerald-600');
        toastIcon.className = 'fa-solid fa-circle-check';
      } else if (type === 'error') {
        toast.className = toast.className.replace(/bg-\w+-\d+/, 'bg-rose-600');
        toastIcon.className = 'fa-solid fa-circle-xmark';
      } else {
        toast.className = toast.className.replace(/bg-\w+-\d+/, 'bg-blue-600');
        toastIcon.className = 'fa-solid fa-circle-info';
      }

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    // ページロード時に実行
    window.onload = init;
  </script>
</body>
</html>
